name: Update Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build playlist
        shell: bash
        run: |
          echo '#EXTM3U x-tvg-url="..."' > playlist.m3u

          while IFS= read -r url || [ -n "$url" ]; do

            [ -z "$url" ] && continue

            echo "Downloading: $url"

            if ! curl -L --fail "$url" -o tmp.m3u; then
                echo "Failed"
                continue
            fi

            awk '
            /^#EXTINF/{
                ext=$0
                getline stream
                gsub(/\r/, "", stream)

                if(!seen[stream]++){
                    print ext
                    print stream
                }
            }
            ' tmp.m3u >> playlist.m3u

          done < sources.txt
          
          rm -f tmp.m3u

          echo "Toplam kanal:"
          grep -c "^#EXTINF" playlist.m3u
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Categorize playlist
        run: python categorize.py
      - name: Commit playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add playlist.m3u report.json unmatched.txt

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Auto update playlist"
            git push
          fi
